<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Status - Local Hands</title>

    <script src="https://kit.fontawesome.com/f09ceee3c1.js" crossorigin="anonymous"></script>
    <style>
        /* Basic styles for the booking status page */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f0f0f0;           
        }  
  
        .booking-status-section {
            padding: 50px 20px;
            background-color: #e0e0e0;
            min-height: calc(100vh - 200px);
        }

        .booking-status-section h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 2.8em;
            color: #ff8c00;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .booking-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        .booking-category {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            padding: 30px;
            border: 1px solid #dcdcdc;
        }

        .booking-category h3 {
            font-size: 2em;
            color: #ff8c00;
            margin-bottom: 20px;
            border-bottom: 2px solid #ffbe73;
            padding-bottom: 10px;
        }

        .booking-item {
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            border-bottom: 1px dashed #cccccc;
        }

        .booking-item:last-child {
            border-bottom: none;  
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .booking-header h4 {
            font-size: 1.4em;
            color: #333333;
            margin: 0;
        }

        .booking-status {
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-confirmed {
            background-color: #d4edda;
            color: #28a745;
        }

        .status-on-the-way {
            background-color: #fff3cd;
            color: #ffa500;
        }

        .status-in-progress {
            background-color: #d1ecf1;
            color: #17a2b8;
        }

        .status-completed {
            background-color: #e9ecef;
            color: #6c757d;
        }

        .status-canceled {
            background-color: #f8d7da;
            color: #dc3545;
        }

        .status-pending {
            background-color: #ffeeba;
            color: #ffc107;
        }

        .booking-details p {
            margin: 6px 0;
            color: #555555;
            font-size: 1em;
            line-height: 1.5;
        }

        .booking-details p strong {
            color: #333333;
        }

        .booking-actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .booking-actions button {
            background-color: #ff8c00;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .booking-actions button:hover {
            background-color: #e67e00;
            transform: translateY(-2px);
        }

        .booking-actions .cancel-btn {
            background-color: #cc4e4e;
        }

        .booking-actions .cancel-btn:hover {
            background-color: #b83d3d;
        }

        .booking-actions .review-btn {
            background-color: #4CAF50;
        }

        .booking-actions .review-btn:hover {
            background-color: #45a049;
        }

        .no-bookings {
            text-align: center;
            color: #888888;
            font-size: 1.2em;
            padding: 30px;
            background-color: #f5f5f5;
            border-radius: 8px;
            margin-top: 20px;
        }

        @media (min-width: 768px) {
            .booking-container {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {
            .booking-status-section h2 {
                font-size: 2em;
            }

            .booking-category {
                padding: 20px;
            }

            .booking-category h3 {
                font-size: 1.5em;
            }

            .booking-header h4 {
                font-size: 1.1em;
            }

            .booking-actions button {
                width: 100%;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="booking-status-section">
        <h2>Your Booking Status</h2>
        <div class="booking-container">
            <div class="booking-category">
                <h3>Current Bookings</h3>
                <div class="booking-list" id="currentBookingsList">
                </div>
                <div class="no-bookings" id="noCurrentBookings" style="display: none;">No current bookings.</div>
            </div>

            <div class="booking-category">
                <h3>Past Bookings</h3>
                <div class="booking-list" id="pastBookingsList">
                </div>
                <div class="no-bookings" id="noPastBookings" style="display: none;">No past bookings.</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadBookings();
        });

        function loadBookings() {
            const userBookingsString = localStorage.getItem('userBookings');
            let userBookings = [];

            if (userBookingsString) {
                try {
                    userBookings = JSON.parse(userBookingsString);
                } catch (e) {
                    console.error("Failed to parse user bookings from local storage:", e);
                    userBookings = [];
                }
            }

            const currentBookingsList = document.getElementById('currentBookingsList');
            const pastBookingsList = document.getElementById('pastBookingsList');
            const noCurrentBookings = document.getElementById('noCurrentBookings');
            const noPastBookings = document.getElementById('noPastBookings');

            currentBookingsList.innerHTML = '';
            pastBookingsList.innerHTML = '';

            let hasCurrentBookings = false;
            let hasPastBookings = false;

            userBookings.sort((a, b) => new Date(b.bookingTime) - new Date(a.bookingTime));

            userBookings.forEach(booking => {
                let status = booking.status || 'Pending';
                let actionsHtml = '';

                const isCurrentBooking = (status !== 'Completed' && status !== 'Canceled');

                if (isCurrentBooking) {
                    actionsHtml = `
                        <button onclick="console.log('Chat with ${booking.providerName} initiated!')">Chat with Provider</button>
                        <button onclick="console.log('Reschedule option clicked for ${booking.issue}!')">Reschedule</button>
                        <button class="cancel-btn" onclick="confirmCancel('${booking.issue}', '${booking.bookingTime}')">Cancel Booking</button>
                    `;
                    hasCurrentBookings = true;
                } else {
                    actionsHtml = `
                        <button class="review-btn" onclick="console.log('Leave a review for ${booking.issue}!')">Leave Review</button>
                        <button onclick="console.log('Rebooking ${booking.issue}!')">Rebook</button>
                    `;
                    hasPastBookings = true;
                }

                let statusClass = '';
                switch(status) {
                    case 'Confirmed': statusClass = 'status-confirmed'; break;
                    case 'On the Way': statusClass = 'status-on-the-way'; break;
                    case 'In Progress': statusClass = 'status-in-progress'; break;
                    case 'Completed': statusClass = 'status-completed'; break;
                    case 'Canceled': statusClass = 'status-canceled'; break;
                    case 'Pending': statusClass = 'status-pending'; break;
                    default: statusClass = 'status-pending';
                }

                const bookingItemHtml = `
                    <div class="booking-item">
                        <div class="booking-header">
                            <h4>${booking.issue}</h4>
                            <span class="booking-status ${statusClass}">${status}</span>
                        </div>
                        <div class="booking-details">
                            <p><strong>Date & Time:</strong> ${booking.bookingTime}</p>
                            <p><strong>Service Provider:</strong> ${booking.providerName || 'N/A'}</p>
                            <p><strong>Phone:</strong> ${booking.phone}</p>
                            ${booking.estimatedArrival && isCurrentBooking ? `<p><strong>Estimated Arrival:</strong> ${booking.estimatedArrival}</p>` : ''}
                            <p><strong>Address:</strong> ${booking.address}</p>
                            <p><strong>Job Details:</strong> ${booking.issue}</p>
                        </div>
                        <div class="booking-actions">
                            ${actionsHtml}
                        </div>
                    </div>
                `;

                if (isCurrentBooking) {
                    currentBookingsList.insertAdjacentHTML('beforeend', bookingItemHtml);
                } else {
                    pastBookingsList.insertAdjacentHTML('beforeend', bookingItemHtml);
                }
            });

            noCurrentBookings.style.display = hasCurrentBookings ? 'none' : 'block';
            noPastBookings.style.display = hasPastBookings ? 'none' : 'block';
        }

        function confirmCancel(issue, bookingTime) {
            if (confirm(`Are you sure you want to cancel the booking for "${issue}" on ${bookingTime}?`)) {
                let userBookings = JSON.parse(localStorage.getItem('userBookings') || '[]');
                let bookingFoundAndUpdated = false;
                userBookings = userBookings.map(booking => {
                    if (booking.issue === issue && booking.bookingTime === bookingTime) {
                        booking.status = 'Canceled';
                        bookingFoundAndUpdated = true;
                    }
                    return booking;
                });

                if (bookingFoundAndUpdated) {
                    localStorage.setItem('userBookings', JSON.stringify(userBookings));
                    console.log(`The booking for "${issue}" has been canceled.`);
                    loadBookings();
                } else {
                    console.error("Could not find the booking to cancel.");
                }
            }
        }
    </script>
</body>

</html>
